<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>재고 위치 찾기</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    overflow-x: hidden; /* 🌟 [버그수정 - 2026.07] 어떤 이유로든 가로로 넘치는 요소가 있어도 화면이 옆으로 안 밀리게 방지 */
  }
  body {
    margin: 0; padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    background: #f0f4f8;
    color: #1a202c;
  }
  h1 {
    font-size: 22px; text-align: center; margin: 8px 0 20px 0; color: #2b6cb0;
  }
  .search-row {
    display: flex; gap: 8px; margin-bottom: 14px;
  }
  #searchBox {
    flex: 1; min-width: 0; font-size: 20px; padding: 14px 16px;
    border: 2px solid #cbd5e0; border-radius: 12px;
  }
  #micBtn {
    width: 62px; height: 62px; font-size: 28px;
    border: none; border-radius: 50%;
    background: #3182ce; color: #fff; cursor: pointer;
    flex-shrink: 0;
  }
  #micBtn.listening {
    background: #e53e3e;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(229,62,62,0.5); }
    70% { box-shadow: 0 0 0 16px rgba(229,62,62,0); }
    100% { box-shadow: 0 0 0 0 rgba(229,62,62,0); }
  }
  #status {
    text-align: center; font-size: 14px; color: #718096; margin-bottom: 14px; min-height: 20px;
  }
  #resultBox { display: flex; flex-direction: column; gap: 12px; }
  .result-card {
    background: #fff; border-radius: 14px; padding: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    border-left: 8px solid #3182ce;
  }
  .result-img {
    width: 100%; max-height: 160px; object-fit: contain;
    border-radius: 10px; margin-bottom: 10px; background: #f7fafc;
  }
  .result-name { font-size: 19px; font-weight: bold; margin-bottom: 8px; }
  .result-location {
    font-size: 26px; font-weight: 900; color: #2b6cb0; margin-bottom: 6px;
  }
  .result-qty { font-size: 15px; color: #4a5568; }
  .result-qty b { font-size: 18px; color: #1a202c; }
  .replay-btn {
    margin-top: 10px; font-size: 14px; padding: 8px 14px;
    border: 1px solid #cbd5e0; border-radius: 8px; background: #f7fafc; cursor: pointer;
  }
  .empty-msg { text-align: center; color: #a0aec0; font-size: 16px; padding: 30px 0; }
  #syncRow {
    text-align: center; margin-top: 24px; font-size: 12px; color: #a0aec0;
  }
  #syncBtn {
    font-size: 12px; padding: 6px 12px; border-radius: 8px; border: 1px solid #cbd5e0; background: #fff; cursor: pointer;
  }

  /* 🌟 [신규 - 2026.07] 송장 스캔(OCR) 관련 스타일 */
  #scanBtn {
    width: 62px; height: 62px; font-size: 26px;
    border: none; border-radius: 50%;
    background: #805ad5; color: #fff; cursor: pointer;
    flex-shrink: 0;
  }
  #scanModal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.92); z-index: 999; flex-direction: column; align-items: center; justify-content: center;
  }
  #scanModal.open { display: flex; }
  #scanVideo, #scanCanvasWrap { max-width: 95vw; max-height: 70vh; }
  #scanCanvasWrap { position: relative; touch-action: none; }
  #scanCanvas { max-width: 95vw; max-height: 70vh; display: block; }
  #scanSelBox {
    position: absolute; border: 3px solid #f6e05e; background: rgba(246,224,94,0.2); display: none;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.4);
  }
  .scan-controls { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
  .scan-btn { font-size: 15px; padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; }
  .scan-btn.primary { background: #f6e05e; color: #1a202c; }
  .scan-btn.secondary { background: #4a5568; color: #fff; }
  #scanHint { color: #fff; font-size: 13px; text-align: center; margin-bottom: 10px; padding: 0 20px; }
  #scanStatus { color: #f6e05e; font-size: 14px; text-align: center; margin-top: 10px; min-height: 20px; }

  /* 🌟 [신규 - 2026.07] 상단 탭 전환 + 오늘의 피킹리스트 스타일 */
  .main-tab-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .main-tab-btn {
    flex: 1; padding: 14px; font-size: 15px; font-weight: bold;
    border: 2px solid #2b6cb0; border-radius: 12px; background: #fff; color: #2b6cb0; cursor: pointer;
  }
  .main-tab-btn.active { background: #2b6cb0; color: #fff; }
  .pick-controls {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: #fff; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px;
  }
  .pick-controls input[type=number] { padding: 6px; border: 1px solid #cbd5e0; border-radius: 6px; }
  .pick-refresh-btn { padding: 8px 14px; border-radius: 8px; border: 1px solid #cbd5e0; background: #f7fafc; cursor: pointer; }
  .pick-batch-card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .pick-batch-head { font-size: 15px; font-weight: bold; color: #2b6cb0; margin-bottom: 10px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; }
  .pick-view-toggle { display: flex; gap: 6px; margin-bottom: 10px; }
  .pick-view-toggle button { flex:1; padding: 8px; font-size: 12px; font-weight: bold; border: 1px solid #cbd5e0; border-radius: 8px; background: #fff; color: #4a5568; cursor: pointer; }
  .pick-view-toggle button.active { background: #805ad5; color: #fff; border-color: #805ad5; }
  .pick-order-block { border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .pick-order-block.done { opacity: 0.4; }
  .pick-order-head { font-size: 14px; font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pick-done-btn { font-size: 12px; padding: 7px 12px; border-radius: 8px; border: none; background: #38a169; color: #fff; font-weight: bold; cursor: pointer; }
  .pick-order-block.done .pick-done-btn { background: #a0aec0; }
  .pick-item-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 19px; border-bottom: 1px solid #f7fafc; }
  /* 🌟 [개편 - 2026.08] 어머니가 보시기에 너무 작고 헷갈린다는 피드백 - 크기를 훨씬 키우고
     상품명과 한 줄에 욱여넣지 않고 위치만 따로 한 줄을 차지하게 바꿨다. */
  .pick-item-loc-line { font-weight: 900; font-size: 24px; line-height: 1.5; padding: 6px 0 2px 0; }
  .pick-item-qty { font-weight: bold; color: #1a202c; white-space: nowrap; }
  .pick-trip-header { font-size: 13px; font-weight: bold; color: #fff; background: #dd6b20; padding: 6px 10px; border-radius: 8px; margin: 10px 0 6px 0; }
  .pick-trip-order-tag { font-size: 11px; color: #718096; }
  .pick-item-wrap { border-bottom: 1px solid #f7fafc; }
  .pick-item-wrap .pick-item-row { border-bottom: none; }
  .pick-item-img-wrap { padding: 4px 0 8px 100px; }

  /* 🌟 [신규 - 2026.07] 상단 배치 인덱스 리스트 */
  #pickIndexBox { margin-bottom: 12px; }
  .pick-index-row {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 10px; padding: 12px 14px; margin-bottom: 6px;
    font-size: 13px; font-weight: bold; color: #2b6cb0; cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .pick-index-row.expanded { background: #ebf8ff; border: 2px solid #2b6cb0; }
  .pick-index-row.all-done { color: #38a169; opacity: 0.7; }
  .pick-index-arrow { color: #a0aec0; }
</style>
</head>
<body>

  <h1>📦 재고 위치 찾기</h1>

  <div class="main-tab-row">
    <button id="mainTabSearch" class="main-tab-btn active" onclick="switchMainTab('search')">🔍 재고 검색</button>
    <button id="mainTabPick" class="main-tab-btn" onclick="switchMainTab('pick')">📋 오늘의 피킹리스트</button>
  </div>

  <div id="searchTabBox">
    <div class="search-row">
      <input type="text" id="searchBox" placeholder="상품명을 입력하거나 마이크를 눌러 말하세요" oninput="onSearchInput()" onkeydown="onSearchKeydown(event)">
      <button id="micBtn" onclick="startVoiceSearch()">🎤</button>
      <button id="scanBtn" onclick="openScanModal()" title="송장을 카메라로 찍어서 상품명을 인식합니다">📷</button>
    </div>
    <div id="status"></div>
    <div id="resultBox"><div class="empty-msg">검색어를 입력하거나 마이크를 눌러주세요</div></div>

    <div id="syncRow">
      마지막 동기화: <span id="syncTime">-</span>
      &nbsp;<button id="syncBtn" onclick="loadData(true)">🔄 최신자료 새로고침</button>
    </div>
  </div>

  <div id="pickTabBox" style="display:none;">
    <div class="pick-controls">
      <label>🛒 한 번에 담을 최대 개수: <input type="number" id="cartCapacity" value="30" min="5" style="width:60px;" onchange="renderPickList()"></label>
      <label>🔎 받는사람 검색: <input type="text" id="pickNameFilter" placeholder="이름 입력" style="width:100px; padding:5px;" oninput="renderPickList()"></label>
      <button class="pick-refresh-btn" onclick="loadPickList()">🔄 새로고침</button>
      <label style="margin-left:auto;"><input type="checkbox" id="hideDoneToggle" onchange="renderPickList()"> 완료된 주문 숨기기</label>
    </div>
    <div id="pickStatus"></div>
    <div id="pickIndexBox"></div>
    <div id="pickListBox"></div>
  </div>

  <!-- 🌟 [신규 - 2026.07] 송장 스캔(카메라 촬영 → 영역 지정 → 문자인식) 모달 -->
  <div id="scanModal">
    <div id="scanHint">① 화면을 한 번 탭해서 초점을 맞춘 뒤, 송장의 품명 부분이 잘 보이면 촬영하세요</div>
    <video id="scanVideo" autoplay playsinline onclick="tryRefocusCamera()"></video>
    <div id="scanCanvasWrap" style="display:none;">
      <canvas id="scanCanvas"></canvas>
      <div id="scanSelBox"></div>
    </div>
    <div id="scanStatus"></div>
    <div class="scan-controls">
      <button class="scan-btn primary" id="scanCaptureBtn" onclick="captureInvoiceFrame()">📸 촬영</button>
      <button class="scan-btn primary" id="scanRecognizeBtn" style="display:none;" onclick="recognizeCroppedRegion()">✅ 이 영역 인식하기</button>
      <button class="scan-btn secondary" id="scanRetakeBtn" style="display:none;" onclick="retakeInvoiceFrame()">🔄 다시 찍기</button>
      <button class="scan-btn secondary" onclick="closeScanModal()">닫기</button>
    </div>
  </div>


<script>
  // ══════════════════════════════════════════════════════════════
  // ⚠️ 여기 두 줄만 본인 환경에 맞게 채워주세요
  // WEBAPP_URL: Apps Script 배포 관리에서 확인한 웹앱 주소 (.../exec 로 끝나는 것)
  // API_KEY: Config.gs의 API_EXPORT_KEY와 동일한 값
  // ══════════════════════════════════════════════════════════════
  const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxW_ymW5HsG_O9dD8sFuAR3FgOe3uy2lpgz4aSBIvotVQ4Wd019YC8ZMKqqrcF0TKRQ1w/exec";
  const API_KEY = "dlwlsgksdmlworhvmfhrmfoa!!!";
  const ORDER_IMPORT_KEY = "xotjdzjajtmdlwlsgks!"; // 🌟 [신규 - 2026.07] 완료처리(쓰기)에 쓰는 키 - Config.gs의 API_ORDER_IMPORT_KEY와 동일해야 함

  let allData = [];
  let searchDebounceTimer = null;
  window._wantBulk = false; // 🌟 [신규 - 2026.07] 마지막 검색이 "저장위치"를 물은 건지 기억

  // 🌟 창고위치 코드 규칙: "XX#-Y##" → "OO#차 Y동 층 호"
  // 새 창고 접두사가 생기면 아래 맵에 한 줄만 추가하면 됩니다.
  const WAREHOUSE_PREFIX_MAP = { 'TS': '태성', 'WH': '창고', 'BX': '박스' };

  function setStatus(msg) { document.getElementById('status').innerText = msg; }

  // 🌟 [버그수정 - 2026.07] 검색어/데이터 양쪽 다 공백을 없애고 소문자로 맞춰서 비교 (띄어쓰기 차이 방지)
  function normalizeForSearch(s) { return String(s || '').toLowerCase().replace(/\s+/g, ''); }

  // 🌟 [신규 - 2026.07] 숫자를 그대로 두면 TTS가 "11"을 "열한"(고유어)으로 읽거나 "4층"을
  // "4번 지층"처럼 이상하게 읽는 문제가 있어서, 아예 한글 독음으로 바꿔서 읽어준다
  // (화면 표시는 그대로 숫자로 - 눈으로 볼 땐 숫자가 더 읽기 편하니까, 읽어줄 때만 이렇게 씀)
  function numberToSinoKorean(n) {
    n = parseInt(n, 10);
    if (isNaN(n)) return String(n);
    if (n === 0) return '영';
    var units4 = ['', '만', '억', '조'];
    var digitNames = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
    var placeNames = ['', '십', '백', '천'];
    var result = '', groupIndex = 0;
    while (n > 0) {
      var group = n % 10000;
      n = Math.floor(n / 10000);
      if (group > 0) {
        var g = group, placeIdx = 0, parts = [];
        while (g > 0) {
          var digit = g % 10;
          if (digit > 0) {
            var digitName = (digit === 1 && placeIdx > 0) ? '' : digitNames[digit];
            parts.unshift(digitName + placeNames[placeIdx]);
          }
          g = Math.floor(g / 10);
          placeIdx++;
        }
        result = parts.join('') + units4[groupIndex] + result;
      }
      groupIndex++;
    }
    return result;
  }

  // 🌟 화면 표시용(숫자 그대로) - 눈으로 읽을 땐 숫자가 자연스러움
  function translateLocationCode(code) {
    if (!code) return '위치 미지정';
    return String(code).split(',').map(function (part) {
      part = part.trim();
      var m = part.match(/^([A-Za-z]{2})(\d+)-([A-Za-z])(\d+)(\d{2})$/);
      if (!m) return part;
      var prefixName = WAREHOUSE_PREFIX_MAP[m[1].toUpperCase()] || m[1].toUpperCase();
      var order = m[2], building = m[3].toUpperCase();
      var floor = parseInt(m[4], 10), unit = parseInt(m[5], 10);
      return prefixName + order + '차 ' + building + '동 ' + floor + '층 ' + unit + '호';
    }).join(', ');
  }

  // 🌟 음성 안내용(한글 독음) - "십일차 A동 사층 일호"처럼 읽어야 정확한 발음이 나옴
  function translateLocationForSpeech(code) {
    if (!code) return '위치 미지정';
    return String(code).split(',').map(function (part) {
      part = part.trim();
      var m = part.match(/^([A-Za-z]{2})(\d+)-([A-Za-z])(\d+)(\d{2})$/);
      if (!m) return part;
      var prefixName = WAREHOUSE_PREFIX_MAP[m[1].toUpperCase()] || m[1].toUpperCase();
      var order = parseInt(m[2], 10), building = m[3].toUpperCase();
      var floor = parseInt(m[4], 10), unit = parseInt(m[5], 10);
      return prefixName + numberToSinoKorean(order) + '차 ' + building + '동 ' + numberToSinoKorean(floor) + '층 ' + numberToSinoKorean(unit) + '호';
    }).join(', ');
  }

  // 🌟 [신규 - 2026.08] 어머니가 피킹리스트를 보실 때 숫자/영문 나열이 헷갈리신다는 피드백으로,
  // "차수/동/층/호"를 각각 다른 색깔로 구분해서 큼직하게 보여주는 버전. HTML(색상 span)을
  // 반환하므로 innerHTML로만 사용해야 함 (일반 텍스트로 쓰면 태그가 그대로 보임).
  function translateLocationCodeColored(code) {
    if (!code) return '위치 미지정';
    return String(code).split(',').map(function (part) {
      part = part.trim();
      var m = part.match(/^([A-Za-z]{2})(\d+)-([A-Za-z])(\d+)(\d{2})$/);
      if (!m) return part;
      var prefixName = WAREHOUSE_PREFIX_MAP[m[1].toUpperCase()] || m[1].toUpperCase();
      var order = m[2], building = m[3].toUpperCase();
      var floor = parseInt(m[4], 10), unit = parseInt(m[5], 10);
      return '<span style="color:#2b6cb0;">' + prefixName + order + '차</span> '
           + '<span style="color:#38a169;">' + building + '동</span> '
           + '<span style="color:#805ad5;">' + floor + '층</span> '
           + '<span style="color:#e53e3e;">' + unit + '호</span>';
    }).join(', ');
  }

  function loadData(manual) {
    document.getElementById('searchBox').disabled = true;
    document.getElementById('micBtn').disabled = true;
    setStatus('⏳ 최신 재고 데이터를 불러오는 중...');
    fetch(WEBAPP_URL + '?action=exportSkuMaster&key=' + encodeURIComponent(API_KEY))
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (!json.success) { setStatus('❌ ' + json.message); return; }
        allData = json.data || [];
        document.getElementById('syncTime').innerText = new Date().toLocaleString('ko-KR');
        setStatus('✅ 총 ' + allData.length + '개 품목 불러왔습니다. 검색해보세요!');
      })
      .catch(function (err) { setStatus('❌ 통신 오류: ' + err + ' (WEBAPP_URL/API_KEY를 다시 확인해주세요)'); })
      .finally(function () {
        document.getElementById('searchBox').disabled = false;
        document.getElementById('micBtn').disabled = false;
      });
  }

  // 🌟 [신규 - 2026.07] "가방정리함 저장위치 어디야?"처럼 물으면, 소분위치가 아니라 저장위치를
  // 찾아달라는 뜻으로 인식 - "저장위치"류 표현을 검색어에서 떼어내고 별도로 기억해둠
  function extractBulkIntent(text) {
    var wantBulk = /저장\s*위치|저장위치|저장\s*장소|저장\s*칸/.test(text);
    var stripped = String(text || '').replace(/저장\s*위치|저장위치|저장\s*장소|저장\s*칸/g, '').trim();
    return { wantBulk: wantBulk, text: stripped };
  }

  // 🌟 "핸드폰스트랩 어디있어?" 같은 흔한 꼬리말을 잘라내고 핵심 검색어만 뽑아냄
  function cleanVoiceQuery(text) {
    var t = String(text || '').trim();
    var patterns = [
      /어디\s*있어\??$/, /어딨어\??$/, /어디\s*있나\??$/, /어디야\??$/, /어디에요\??$/,
      /위치\s*(가|는)?\s*(어디)?\??$/, /찾아줘\??$/, /알려줘\??$/, /어디\??$/, /\?+$/
    ];
    var changed = true;
    while (changed) {
      changed = false;
      for (var i = 0; i < patterns.length; i++) {
        var newT = t.replace(patterns[i], '').trim();
        if (newT !== t) { t = newT; changed = true; }
      }
    }
    return t.trim();
  }

  // 🌟 [변경 - 2026.07] 타이핑할 때도 "다시듣기" 안 눌러도 자동으로 음성이 나오게:
  // 타이핑 멈추고 0.7초 지나면 자동으로 읽어줌 (매 글자마다 읽으면 시끄러우니 디바운스 적용)
  function onSearchInput() {
    var raw = document.getElementById('searchBox').value;
    var intent = extractBulkIntent(raw);
    window._wantBulk = intent.wantBulk;
    renderResults(intent.text);
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(function () { speakTopResult(intent.text); }, 700);
  }
  // 엔터 누르면 디바운스 기다릴 필요 없이 바로 읽어줌
  function onSearchKeydown(e) {
    if (e.key === 'Enter') {
      clearTimeout(searchDebounceTimer);
      var raw = document.getElementById('searchBox').value;
      var intent = extractBulkIntent(raw);
      window._wantBulk = intent.wantBulk;
      speakTopResult(intent.text);
    }
  }

  function renderResults(query) {
    var box = document.getElementById('resultBox');
    var keyword = normalizeForSearch(query);
    if (!keyword) { box.innerHTML = '<div class="empty-msg">검색어를 입력하거나 마이크를 눌러주세요</div>'; window._lastMatched = []; return; }

    var matched = allData.filter(function (it) {
      // 🌟 회사 옵션명 앞에 붙는 "B" 접두사(예: "B가방정리함 블랙")는 사용자가 말할 때 안 부르니까,
      // 접두사 뺀 버전과 안 뺀 버전 둘 다로 비교해서 안전하게 매칭
      var optionNoPrefix = String(it.optionName || '').replace(/^B/, '');
      var hay = normalizeForSearch((it.productName || '') + ' ' + (it.optionName || '') + ' ' + optionNoPrefix + ' ' + (it.skuId || '') + ' ' + (it.searchAliases || '') + ' ' + (it.keywords || ''));
      return hay.indexOf(keyword) !== -1;
    });

    window._lastMatched = matched;
    renderMatchedCards(matched, '"' + query + '" 검색 결과가 없습니다.');
  }

  // 🌟 [신규 - 2026.07] 카드 렌더링 부분을 공용 함수로 분리 - 일반 검색과 송장스캔(여러 상품 동시검색) 둘 다 재사용
  function renderMatchedCards(matched, emptyMsg) {
    var box = document.getElementById('resultBox');
    if (matched.length === 0) {
      box.innerHTML = '<div class="empty-msg">' + emptyMsg + '</div>';
      return;
    }
    box.innerHTML = matched.slice(0, 20).map(function (it, idx) {
      var friendly = translateLocationCodeColored(it.location);
      var imgHtml = it.skuImageUrl
        ? '<img src="' + it.skuImageUrl + '" class="result-img" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display=\'none\'">'
        : '';
      var bulkHtml = it.bulkLocation ? '<div class="result-qty">📦 저장위치: ' + translateLocationCodeColored(it.bulkLocation) + '</div>' : '';
      return '<div class="result-card">'
        + imgHtml
        + '<div class="result-name">' + (it.productName || '') + (it.optionName ? ' · ' + it.optionName : '') + '</div>'
        + '<div class="result-location">📍 ' + friendly + '</div>'
        + '<div class="result-qty">재고: <b>' + it.currentStock + '개</b></div>'
        + bulkHtml
        + '<button class="replay-btn" onclick="speakOne(' + idx + ')">🔊 다시 듣기</button>'
        + '</div>';
    }).join('');
  }

  // 🌟 검색된 목록의 맨 위(첫 번째) 결과를 바로 읽어줌 - 여러 건이어도 무조건 첫 번째부터 알려줌
  function speakTopResult(query) {
    var matched = window._lastMatched || [];
    if (matched.length === 0) {
      if (normalizeForSearch(query)) speakText('"' + query + '" 검색 결과가 없습니다.');
      return;
    }
    speakOneItem(matched[0]);
  }

  function speakOne(idx) {
    if (window._lastMatched && window._lastMatched[idx]) speakOneItem(window._lastMatched[idx]);
  }

  // 🌟 [변경 - 2026.07] "저장위치 어디야?"라고 물었으면 저장위치를, 아니면 기본값인 소분위치를 답한다.
  // 저장위치를 물었는데 그 상품엔 저장위치가 따로 없으면, 없다는 걸 알려주고 소분위치라도 알려줌.
  function itemSpeechText(it) {
    if (window._wantBulk) {
      if (it.bulkLocation) {
        return (it.productName || '') + ' 저장위치는 ' + translateLocationForSpeech(it.bulkLocation) + '입니다.';
      }
      return (it.productName || '') + '은 별도 저장위치가 없습니다. 소분위치는 ' + translateLocationForSpeech(it.location) + '입니다.';
    }
    return (it.productName || '') + ' 위치는 ' + translateLocationForSpeech(it.location) + '입니다.';
  }

  function speakOneItem(it) {
    speakText(itemSpeechText(it));
  }

  function speakText(text) {
    if (!('speechSynthesis' in window)) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  function startVoiceSearch() {
    var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) { alert('이 브라우저는 음성 인식을 지원하지 않습니다. 크롬을 이용해주세요.'); return; }
    var recognition = new SpeechRec();
    recognition.lang = 'ko-KR';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    var btn = document.getElementById('micBtn');
    btn.classList.add('listening');
    setStatus('🎙️ 듣고 있습니다...');

    recognition.onresult = function (event) {
      var raw = event.results[0][0].transcript;
      var intent = extractBulkIntent(raw);
      window._wantBulk = intent.wantBulk;
      var cleaned = cleanVoiceQuery(intent.text);
      document.getElementById('searchBox').value = cleaned;
      setStatus('"' + raw + '" 라고 들었어요 → "' + cleaned + '"로 검색합니다' + (intent.wantBulk ? ' (저장위치 조회)' : ''));
      renderResults(cleaned);
      speakTopResult(cleaned);
    };
    recognition.onerror = function (event) {
      btn.classList.remove('listening');
      if (event.error === 'not-allowed') setStatus('❌ 마이크 권한이 막혀있습니다. 주소창 자물쇠 아이콘에서 마이크를 허용해주세요.');
      else if (event.error !== 'no-speech') setStatus('❌ 음성 인식 오류: ' + event.error);
      else setStatus('');
    };
    recognition.onend = function () { btn.classList.remove('listening'); };
    recognition.start();
  }

  // ═══════════════════════════════════════════════════════════
  // 🌟 [신규 - 2026.07] 송장 스캔 - 카메라로 찍고, 상품명 부분을 손가락으로 드래그해서 지정하면
  // 그 영역만 문자인식(OCR)해서 검색까지 한 번에 해준다 (음성보다 정확도가 훨씬 좋음).
  // ═══════════════════════════════════════════════════════════
  let scanStream = null;
  let scanSelecting = false, scanStartX = 0, scanStartY = 0, scanRect = null;

  function openScanModal() {
    document.getElementById('scanModal').classList.add('open');
    document.getElementById('scanHint').innerText = '① 화면을 한 번 탭해서 초점을 맞춘 뒤, 송장의 품명 부분이 잘 보이면 촬영하세요';
    document.getElementById('scanVideo').style.display = 'block';
    document.getElementById('scanCanvasWrap').style.display = 'none';
    document.getElementById('scanCaptureBtn').style.display = 'inline-block';
    document.getElementById('scanRecognizeBtn').style.display = 'none';
    document.getElementById('scanRetakeBtn').style.display = 'none';
    document.getElementById('scanStatus').innerText = '';
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment',
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        advanced: [{ focusMode: 'continuous' }]
      }
    })
      .then(function (stream) {
        scanStream = stream;
        document.getElementById('scanVideo').srcObject = stream;
      })
      .catch(function (err) {
        document.getElementById('scanStatus').innerText = '❌ 카메라를 열 수 없습니다: ' + err.message;
      });
  }

  function closeScanModal() {
    document.getElementById('scanModal').classList.remove('open');
    if (scanStream) { scanStream.getTracks().forEach(function (t) { t.stop(); }); scanStream = null; }
  }

  function captureInvoiceFrame() {
    var video = document.getElementById('scanVideo');
    var canvas = document.getElementById('scanCanvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

    if (scanStream) { scanStream.getTracks().forEach(function (t) { t.stop(); }); scanStream = null; }
    video.style.display = 'none';
    document.getElementById('scanCanvasWrap').style.display = 'block';
    document.getElementById('scanCaptureBtn').style.display = 'none';
    document.getElementById('scanRecognizeBtn').style.display = 'inline-block';
    document.getElementById('scanRetakeBtn').style.display = 'inline-block';
    document.getElementById('scanHint').innerText = '② 상품명이 적힌 부분을 손가락(또는 마우스)으로 드래그해서 네모로 선택하세요';
    scanRect = null;
    document.getElementById('scanSelBox').style.display = 'none';
    setupScanSelection();
  }

  function retakeInvoiceFrame() { openScanModal(); }

  function tryRefocusCamera() {
    if (!scanStream) return;
    var track = scanStream.getVideoTracks()[0];
    if (!track || !track.applyConstraints) return;
    track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
    var status = document.getElementById('scanStatus');
    status.innerText = '🔍 초점 다시 맞추는 중...';
    setTimeout(function () { if (status.innerText === '🔍 초점 다시 맞추는 중...') status.innerText = ''; }, 800);
  }

  function setupScanSelection() {
    var wrap = document.getElementById('scanCanvasWrap');
    var canvas = document.getElementById('scanCanvas');
    var selBox = document.getElementById('scanSelBox');

    function getPos(e) {
      var rect = canvas.getBoundingClientRect();
      var clientX = (e.touches ? e.touches[0].clientX : e.clientX);
      var clientY = (e.touches ? e.touches[0].clientY : e.clientY);
      return { x: clientX - rect.left, y: clientY - rect.top };
    }
    function onStart(e) {
      e.preventDefault();
      var p = getPos(e);
      scanSelecting = true; scanStartX = p.x; scanStartY = p.y;
      selBox.style.left = p.x + 'px'; selBox.style.top = p.y + 'px';
      selBox.style.width = '0px'; selBox.style.height = '0px';
      selBox.style.display = 'block';
    }
    function onMove(e) {
      if (!scanSelecting) return;
      e.preventDefault();
      var p = getPos(e);
      var x = Math.min(p.x, scanStartX), y = Math.min(p.y, scanStartY);
      var w = Math.abs(p.x - scanStartX), h = Math.abs(p.y - scanStartY);
      selBox.style.left = x + 'px'; selBox.style.top = y + 'px';
      selBox.style.width = w + 'px'; selBox.style.height = h + 'px';
    }
    function onEnd() {
      if (!scanSelecting) return;
      scanSelecting = false;
      var rect = canvas.getBoundingClientRect();
      var scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
      var left = parseFloat(selBox.style.left) || 0, top = parseFloat(selBox.style.top) || 0;
      var w = parseFloat(selBox.style.width) || 0, h = parseFloat(selBox.style.height) || 0;
      scanRect = { x: left * scaleX, y: top * scaleY, w: w * scaleX, h: h * scaleY };
    }
    wrap.onmousedown = onStart; wrap.onmousemove = onMove; wrap.onmouseup = onEnd;
    wrap.ontouchstart = onStart; wrap.ontouchmove = onMove; wrap.ontouchend = onEnd;
  }

  function recognizeCroppedRegion() {
    var canvas = document.getElementById('scanCanvas');
    var status = document.getElementById('scanStatus');
    var srcRect = scanRect;
    if (!srcRect || srcRect.w < 10 || srcRect.h < 10) srcRect = { x: 0, y: 0, w: canvas.width, h: canvas.height };

    var cropCanvas = document.createElement('canvas');
    cropCanvas.width = srcRect.w; cropCanvas.height = srcRect.h;
    cropCanvas.getContext('2d').drawImage(canvas, srcRect.x, srcRect.y, srcRect.w, srcRect.h, 0, 0, srcRect.w, srcRect.h);

    status.innerText = '⏳ 문자를 인식하는 중입니다... (처음엔 조금 걸릴 수 있어요)';
    Tesseract.recognize(cropCanvas, 'kor', {
      logger: function (m) { if (m.status === 'recognizing text') status.innerText = '⏳ 인식 중... ' + Math.round(m.progress * 100) + '%'; }
    }).then(function (result) {
      status.innerText = '✅ 인식 완료';
      processInvoiceOcrText(result.data.text || '');
    }).catch(function (err) {
      status.innerText = '❌ 인식 실패: ' + err.message;
    });
  }

  function processInvoiceOcrText(rawText) {
    var lines = rawText.split(/\n+/).map(function (l) { return l.trim(); }).filter(function (l) { return l.length > 1; });
    var candidates = lines.map(function (l) { return l.split('/')[0].trim(); }).filter(function (c) { return c; });

    if (candidates.length === 0) {
      document.getElementById('scanStatus').innerText = '❌ 인식된 글자가 없습니다. 다시 영역을 지정해주세요.';
      return;
    }
    closeScanModal();
    searchMultipleQueries(candidates);
  }

  function searchMultipleQueries(queries) {
    var seenIds = {};
    var combined = [];
    queries.forEach(function (q) {
      var keyword = normalizeForSearch(q);
      if (!keyword) return;
      allData.forEach(function (it) {
        if (seenIds[it.skuId]) return;
        var optionNoPrefix = String(it.optionName || '').replace(/^B/, '');
        var hay = normalizeForSearch((it.productName || '') + ' ' + (it.optionName || '') + ' ' + optionNoPrefix + ' ' + (it.skuId || '') + ' ' + (it.searchAliases || '') + ' ' + (it.keywords || ''));
        if (hay.indexOf(keyword) !== -1) { seenIds[it.skuId] = true; combined.push(it); }
      });
    });

    document.getElementById('searchBox').value = queries.join(', ');
    window._lastMatched = combined;
    setStatus('📷 송장에서 "' + queries.join('", "') + '" 인식 → 총 ' + combined.length + '건 찾음');
    renderMatchedCards(combined, '인식된 상품명으로 찾은 결과가 없습니다.');
    if (combined.length > 0) speakOneItem(combined[0]);
    else speakText('인식된 상품을 찾지 못했습니다.');
  }

  // ═══════════════════════════════════════════════════════════
  // 🌟 [신규 - 2026.07] 오늘의 피킹리스트
  // ═══════════════════════════════════════════════════════════
  let pickBatches = [];
  let pickViewMode = {};

  function switchMainTab(tab) {
    document.getElementById('searchTabBox').style.display = tab === 'search' ? 'block' : 'none';
    document.getElementById('pickTabBox').style.display = tab === 'pick' ? 'block' : 'none';
    document.getElementById('mainTabSearch').classList.toggle('active', tab === 'search');
    document.getElementById('mainTabPick').classList.toggle('active', tab === 'pick');
    if (tab === 'pick' && pickBatches.length === 0) loadPickList();
  }

  function loadPickList() {
    var status = document.getElementById('pickStatus');
    status.innerText = '⏳ 오늘의 주문을 불러오는 중...';
    fetch(WEBAPP_URL + '?action=getTodayPickList&key=' + encodeURIComponent(API_KEY))
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (!json.success) { status.innerText = '❌ ' + json.message; return; }
        pickBatches = json.data || [];
        status.innerText = pickBatches.length === 0 ? '오늘 업로드된 주문이 없습니다.' : '✅ 배치 ' + pickBatches.length + '건 불러옴';
        pickBatches.forEach(function (b) { if (!pickViewMode[b.importId]) pickViewMode[b.importId] = 'order'; });
        renderPickList();
      })
      .catch(function (err) { status.innerText = '❌ 통신 오류: ' + err; });
  }

  function splitIntoTrips(flatItems, capacity) {
    var trips = [];
    var current = [], currentQty = 0;
    flatItems.forEach(function (it) {
      var qty = Number(it.qty) || 0;
      if (qty >= capacity) {
        if (current.length > 0) { trips.push(current); current = []; currentQty = 0; }
        trips.push([it]);
        return;
      }
      if (currentQty + qty > capacity && current.length > 0) { trips.push(current); current = []; currentQty = 0; }
      current.push(it); currentQty += qty;
    });
    if (current.length > 0) trips.push(current);
    return trips;
  }

  function switchPickViewMode(importId, mode) {
    pickViewMode[importId] = mode;
    renderPickList();
  }

  let pickRowIdCounter = 0;
  let pickBatchExpanded = {};
  let pickOrderExpanded = {};

  function pickItemRowHtml(it) {
    var rowId = 'pickimg' + (pickRowIdCounter++);
    var hasImg = !!it.skuImageUrl;
    var imgHtml = hasImg
      ? '<div class="pick-item-img-wrap" id="' + rowId + '" style="display:none; padding-left:0;"><img src="' + it.skuImageUrl + '" referrerpolicy="no-referrer" loading="lazy" style="max-width:170px; max-height:170px; border-radius:8px; margin:6px 0; display:block;"></div>'
      : '';
    var clickAttr = hasImg ? ' onclick="toggleItemImage(\'' + rowId + '\')" style="cursor:pointer;"' : '';
    var label = it.optionName || it.productName || '';
    // 🌟 [개편 - 2026.08] "TS02-D601" 같은 원본 코드 대신 "태성2차 D동 6층 1호"처럼 해독하고,
    // 차수/동/층/호를 색깔로 구분해서 큰 글씨로 따로 한 줄에 보여준다(어머니가 헷갈려하셔서 개선).
    return '<div class="pick-item-wrap">'
      + '<div class="pick-item-loc-line">📍 ' + translateLocationCodeColored(it.location) + '</div>'
      + '<div class="pick-item-row"' + clickAttr + '>'
      + '<span style="flex:1;">' + label + (it.orderTag ? '<div class="pick-trip-order-tag">→ ' + it.orderTag + '</div>' : '') + (hasImg ? '<span style="color:#a0aec0; font-size:11px;"> 🖼️눌러서 사진보기</span>' : '') + '</span>'
      + '<span class="pick-item-qty">' + it.qty + '개</span>'
      + '</div>'
      + imgHtml
      + '</div>';
  }
  function toggleItemImage(rowId) {
    var el = document.getElementById(rowId);
    if (el) el.style.display = (el.style.display === 'block') ? 'none' : 'block';
  }
  function toggleBatchExpand(importId) {
    pickBatchExpanded[importId] = !pickBatchExpanded[importId];
    renderPickList();
  }
  function toggleOrderExpand(groupKey, event) {
    if (event) event.stopPropagation();
    pickOrderExpanded[groupKey] = pickOrderExpanded[groupKey] === false ? true : false;
    renderPickList();
  }

  function renderPickIndex() {
    var nameFilter = (document.getElementById('pickNameFilter').value || '').trim().toLowerCase();
    return pickBatches.map(function (batch) {
      var doneCount = batch.orders.filter(function (o) { return o.isDone; }).length;
      var allDone = batch.orders.length > 0 && doneCount === batch.orders.length;
      var expanded = !!pickBatchExpanded[batch.importId];
      return '<div class="pick-index-row' + (allDone ? ' all-done' : '') + (expanded ? ' expanded' : '') + '" onclick="toggleBatchExpand(\'' + batch.importId + '\')">'
        + '<span>' + (allDone ? '✅ ' : '🕐 ') + batch.uploadedAt + ' 업로드 · ' + batch.fileName + ' (완료 ' + doneCount + '/' + batch.orders.length + ')</span>'
        + '<span class="pick-index-arrow">' + (expanded ? '▼' : '▶') + '</span>'
        + '</div>';
    }).join('');
  }

  function renderPickList() {
    document.getElementById('pickIndexBox').innerHTML = pickBatches.length === 0 ? '' : renderPickIndex();

    var box = document.getElementById('pickListBox');
    var hideDone = document.getElementById('hideDoneToggle').checked;
    var capacity = Number(document.getElementById('cartCapacity').value) || 30;
    var nameFilter = (document.getElementById('pickNameFilter').value || '').trim().toLowerCase();

    if (pickBatches.length === 0) { box.innerHTML = ''; return; }

    var expandedBatches = pickBatches.filter(function (b) { return pickBatchExpanded[b.importId]; });
    if (expandedBatches.length === 0) { box.innerHTML = '<div style="color:#a0aec0; text-align:center; padding:16px;">위 목록에서 배치를 눌러 펼쳐보세요.</div>'; return; }

    box.innerHTML = expandedBatches.map(function (batch) {
      var nameFiltered = nameFilter ? batch.orders.filter(function (o) { return String(o.receiverName || '').toLowerCase().indexOf(nameFilter) !== -1; }) : batch.orders;
      var orders = nameFiltered.filter(function (o) { return !hideDone || !o.isDone; });
      var mode = pickViewMode[batch.importId] || 'order';

      var bodyHtml;
      if (mode === 'order') {
        var sortedOrders = orders.slice().sort(function (a, b) { return (a.isDone ? 1 : 0) - (b.isDone ? 1 : 0); });
        bodyHtml = sortedOrders.map(function (o) {
          var oExpanded = pickOrderExpanded[o.groupKey] !== false;
          var itemRows = oExpanded ? o.items.map(function (it) { return pickItemRowHtml(it); }).join('') : '';
          return '<div class="pick-order-block' + (o.isDone ? ' done' : '') + '">'
            + '<div class="pick-order-head" onclick="toggleOrderExpand(\'' + o.groupKey + '\', event)" style="cursor:pointer;">'
            + '<span>' + (oExpanded ? '▼' : '▶') + ' <b>' + (o.receiverName || '') + '</b> <span style="color:#805ad5; font-size:11px;">[' + (o.platform || '') + ' ' + (o.platformOrderNo || '') + ']</span></span>'
            + '<button class="pick-done-btn" onclick="togglePickDone(\'' + o.groupKey + '\', ' + (!o.isDone) + ', event)">' + (o.isDone ? '↩️ 완료취소' : '✅ 완료') + '</button></div>'
            + itemRows
            + '</div>';
        }).join('');
        if (orders.length === 0) bodyHtml = '<div style="color:#a0aec0; padding:10px;">표시할 주문이 없습니다.</div>';
      } else {
        var flat = [];
        orders.forEach(function (o) {
          if (o.isDone) return;
          o.items.forEach(function (it) { flat.push({ location: it.location, productName: it.productName, optionName: it.optionName, qty: it.qty, skuImageUrl: it.skuImageUrl, orderTag: (o.receiverName || '') }); });
        });
        flat.sort(function (a, b) { return String(a.location).localeCompare(String(b.location)); });
        var trips = splitIntoTrips(flat, capacity);
        if (trips.length === 0) {
          bodyHtml = '<div style="color:#a0aec0; padding:10px;">표시할 항목이 없습니다.</div>';
        } else {
          bodyHtml = trips.map(function (trip, tIdx) {
            var qtySum = trip.reduce(function (s, it) { return s + (Number(it.qty) || 0); }, 0);
            var rows = trip.map(function (it) { return pickItemRowHtml(it); }).join('');
            return '<div class="pick-trip-header">🛒 ' + (tIdx + 1) + '차 이동 (총 ' + qtySum + '개)</div>' + rows;
          }).join('');
        }
      }

      return '<div class="pick-batch-card">'
        + '<div class="pick-batch-head" onclick="toggleBatchExpand(\'' + batch.importId + '\')" style="cursor:pointer;">'
        + '<span>▼ 🕐 ' + batch.uploadedAt + ' 업로드 · ' + batch.fileName + ' (총 ' + batch.orders.length + '건)</span>'
        + '</div>'
        + '<div class="pick-view-toggle">'
        + '<button class="' + (mode === 'order' ? 'active' : '') + '" onclick="switchPickViewMode(\'' + batch.importId + '\', \'order\')">🗂️ 주문별 (포장용)</button>'
        + '<button class="' + (mode === 'loc' ? 'active' : '') + '" onclick="switchPickViewMode(\'' + batch.importId + '\', \'loc\')">📍 위치별 (동선 최소화)</button>'
        + '</div>'
        + bodyHtml
        + '</div>';
    }).join('');
  }

  function togglePickDone(groupKey, isDone, event) {
    if (event) event.stopPropagation();
    fetch(WEBAPP_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'markPickDone', key: ORDER_IMPORT_KEY, groupKey: groupKey, isDone: isDone })
    }).then(function (res) { return res.json(); })
      .then(function (json) {
        if (!json.success) { alert('처리 실패: ' + json.message); return; }
        pickBatches.forEach(function (b) { b.orders.forEach(function (o) { if (o.groupKey === groupKey) o.isDone = isDone; }); });
        renderPickList();
      })
      .catch(function (err) { alert('통신 오류: ' + err); });
  }

  // 페이지 열리자마자 자동으로 최신 데이터 불러오기
  loadData(false);
</script>

</body>
</html>
